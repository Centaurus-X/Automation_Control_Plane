{{- if .Values.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: automation-mqtt
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: automation-platform
spec:
  serviceName: automation-mqtt
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: automation-mqtt
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: automation-mqtt
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: automation-platform
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mqtt
          image: "{{ required "image.repository is required" .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
          ports:
            - name: mqtts
              containerPort: 8883
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["mosquitto_sub", "-h", "127.0.0.1", "-p", "8883", "-V", "5", "-q", "0", "-i", "automation-mqtt-health", "--cafile", "/run/secrets/mqtt_ca", "--cert", "/run/secrets/mqtt_health_cert", "--key", "/run/secrets/mqtt_health_key", "-t", "$SYS/broker/uptime", "-C", "1", "-W", "5"]
            failureThreshold: 24
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["mosquitto_sub", "-h", "127.0.0.1", "-p", "8883", "-V", "5", "-q", "0", "-i", "automation-mqtt-health", "--cafile", "/run/secrets/mqtt_ca", "--cert", "/run/secrets/mqtt_health_cert", "--key", "/run/secrets/mqtt_health_key", "-t", "$SYS/broker/uptime", "-C", "1", "-W", "5"]
            periodSeconds: 10
            timeoutSeconds: 8
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
            - name: tls
              mountPath: /run/secrets
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
            - name: tmp
              mountPath: /tmp
            - name: log
              mountPath: /mosquitto/log
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: tls
          secret:
            secretName: {{ required "secretRefs.tls is required" .Values.secretRefs.tls }}
            defaultMode: 0440
            items:
              - {key: ca.crt, path: mqtt_ca}
              - {key: tls.crt, path: mqtt_broker_cert}
              - {key: tls.key, path: mqtt_broker_key}
              - {key: health.crt, path: mqtt_health_cert}
              - {key: health.key, path: mqtt_health_key}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: log
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: automation-mqtt
          app.kubernetes.io/instance: {{ .Release.Name }}
          app.kubernetes.io/part-of: automation-platform
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}

{{- end }}
