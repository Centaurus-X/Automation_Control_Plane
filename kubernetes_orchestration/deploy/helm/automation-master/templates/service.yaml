{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: automation-master
  labels:
    app.kubernetes.io/name: automation-master
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: automation-platform
spec:
  selector:
    app.kubernetes.io/name: automation-master
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: metrics, port: 9090, targetPort: metrics, protocol: TCP}

{{- end }}
