{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: automation-mcp-controller
  labels:
    app.kubernetes.io/name: automation-mcp-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: automation-platform
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: automation-mcp-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}

{{- end }}
