{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: automation-cluster-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: automation-platform
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: automation-cluster-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: automation-cluster-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: automation-platform
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: stage-agent-token
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args: ["install -m 0600 /source/agent.token /staged/agent.token"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: token-source, mountPath: /source, readOnly: true}
            - {name: token-runtime, mountPath: /staged}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: cluster-agent
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "-m", "automation_fleet.cluster_agent"]
          args: ["--root", "/opt/automation-fleet", "--config", "/etc/automation-agent/agent.json"]
          env:
            - name: AGENT_HOLDER_ID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - {name: HELM_DRIVER, value: secret}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["python3", "-c", "import os,time; raise SystemExit(0 if time.time()-os.stat('/tmp/agent-health.json').st_mtime < 90 else 1)"]
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["python3", "-c", "import json,time; v=json.load(open('/tmp/agent-health.json')); raise SystemExit(0 if time.time()-v['observed_at_unix'] < 45 and v['state']['status'] != 'ERROR' else 1)"]
            initialDelaySeconds: 8
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /etc/automation-agent, readOnly: true}
            - {name: token-runtime, mountPath: /run/agent-token, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-config}
        - name: token-source
          secret:
            secretName: {{ .Values.secretRefs.agentToken }}
            defaultMode: 0440
            items: [{key: agent.token, path: agent.token}]
        - name: token-runtime
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
{{- end }}
