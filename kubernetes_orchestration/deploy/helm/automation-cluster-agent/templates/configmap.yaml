{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: automation-cluster-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: automation-platform
data:
  agent.json: |
    {
      "schema_version": 1,
      "central_url": {{ .Values.centralUrl | quote }},
      "allow_insecure_http": {{ .Values.allowInsecureHttp }},
      "target_id": {{ .Values.targetId | quote }},
      "cluster_id": {{ .Values.clusterId | quote }},
      "holder_id": "overridden-by-pod-uid",
      "namespace": {{ .Release.Namespace | quote }},
      "lease_name": {{ .Values.leaseName | quote }},
      "lease_ttl_s": {{ .Values.leaseTtlSeconds }},
      "poll_interval_s": {{ .Values.pollIntervalSeconds }},
      "token_file": "/run/agent-token/agent.token",
      "health_file": "/tmp/agent-health.json",
      "capabilities": {{ .Values.capabilities | toJson }}
    }
{{- end }}
