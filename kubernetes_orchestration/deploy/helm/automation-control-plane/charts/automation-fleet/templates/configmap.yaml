{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: automation-fleet
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: automation-platform
data:
  fleet.json: |
    {
      "schema_version": 1,
      "listen": {"host": "0.0.0.0", "port": 9080},
      "inventory_path": "/etc/automation-fleet/inventory.json",
      "catalog_path": "/opt/automation-fleet/config/release_catalog.json",
      "desired_state_path": "/etc/automation-fleet/desired-state.json",
      "policy_path": "/etc/automation-fleet/policy.json",
      "admin_token_file": "/run/secrets/admin.token",
      "operator_token_file": "/run/secrets/operator.token",
      "approver_token_file": "/run/secrets/approver.token",
      "auditor_token_file": "/run/secrets/auditor.token",
      "viewer_token_file": "/run/secrets/viewer.token",
      "agent_registry_path": "/etc/automation-fleet/agents.json",
      "state_dir": "/var/lib/automation-fleet",
      "observe_timeout_s": 30
    }
  inventory.json: |
{{ .Values.config.inventoryJson | indent 4 }}
  agents.json: |
{{ .Values.config.agentRegistryJson | indent 4 }}
  desired-state.json: |
{{ .Values.config.desiredStateJson | indent 4 }}
  policy.json: |
{{ .Values.config.policyJson | indent 4 }}

{{- end }}
