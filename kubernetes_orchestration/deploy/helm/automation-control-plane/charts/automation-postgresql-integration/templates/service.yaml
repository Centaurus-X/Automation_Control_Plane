{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    app.kubernetes.io/name: automation-postgresql-integration
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: automation-platform
    app.kubernetes.io/managed-by: Helm
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ExternalName
  externalName: {{ required "external.host is required" .Values.external.host | quote }}
  ports:
    - name: postgresql
      port: {{ .Values.external.port }}
      protocol: TCP
      targetPort: {{ .Values.external.port }}

{{- end }}
