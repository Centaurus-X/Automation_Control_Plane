{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: automation-mqtt
  labels:
    app.kubernetes.io/name: automation-mqtt
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: automation-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: automation-mqtt
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: mqtts
      port: 8883
      protocol: TCP
      targetPort: mqtts

{{- end }}
