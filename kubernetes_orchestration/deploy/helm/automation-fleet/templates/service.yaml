{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: automation-fleet
  labels:
    app.kubernetes.io/name: automation-fleet
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: automation-platform
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: automation-fleet
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}

{{- end }}
