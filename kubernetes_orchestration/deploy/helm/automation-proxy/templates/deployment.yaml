{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: automation-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: automation-platform
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: automation-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: automation-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: automation-platform
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 75
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: proxy
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: AUTOMATION_SITE_ID, value: {{ .Values.siteId | quote }}}
            - {name: PROXY_INSTANCE_ID, value: {{ .Values.proxyInstanceId | quote }}}
            - {name: MASTER_INSTANCE_ID, value: {{ .Values.masterInstanceId | quote }}}
            - {name: PROXY_CONFIG_AUTHORITY, value: node_local}
            - {name: MQTT_HOST, value: {{ .Values.mqtt.host | quote }}}
            - {name: MQTT_PORT, value: {{ .Values.mqtt.port | quote }}}
            - {name: MQTT_REQUIRED, value: {{ .Values.mqtt.required | quote }}}
            - {name: MQTT_TLS_ENABLED, value: "true"}
            - {name: MQTT_ALLOW_INSECURE_TRANSPORT, value: "false"}
            - {name: PROXY_DB_HOST, value: {{ .Values.database.host | quote }}}
            - {name: PROXY_DB_PORT, value: {{ .Values.database.port | quote }}}
            - {name: PROXY_DB_NAME, value: {{ .Values.database.name | quote }}}
            - {name: PROXY_DB_USER, value: {{ .Values.database.appUser | quote }}}
            - {name: PROXY_DB_PASSWORD_FILE, value: /run/secrets/proxy_db_password}
            - {name: PROXY_DB_SSLMODE, value: verify-full}
            - {name: PROXY_DB_SSLROOTCERT, value: /run/secrets/postgres_ca}
            - {name: PROXY_TLS_ENABLED, value: "true"}
            - {name: PROXY_TLS_CERT_FILE, value: /run/secrets/proxy_https_cert}
            - {name: PROXY_TLS_KEY_FILE, value: /run/secrets/proxy_https_key}
            - {name: PROXY_WSS_HOST, value: 0.0.0.0}
            - {name: PROXY_WSS_PORT, value: "8443"}
            - {name: PROXY_WSS_CERT_FILE, value: /run/secrets/proxy_wss_cert}
            - {name: PROXY_WSS_KEY_FILE, value: /run/secrets/proxy_wss_key}
            - {name: PROXY_HTTPS_HOST, value: 0.0.0.0}
            - {name: PROXY_HTTPS_PORT, value: "8444"}
            - {name: PROXY_ORIGIN_ALLOWLIST, value: {{ .Values.originAllowlist | quote }}}
          ports:
            - {name: wss, containerPort: 8443, protocol: TCP}
            - {name: https, containerPort: 8444, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {scheme: HTTPS, path: /api/v1/health/ready, port: https}
            failureThreshold: 24
            periodSeconds: 5
          livenessProbe:
            httpGet: {scheme: HTTPS, path: /api/v1/health/live, port: https}
            periodSeconds: 15
          readinessProbe:
            httpGet: {scheme: HTTPS, path: /api/v1/health/ready, port: https}
            periodSeconds: 10
          volumeMounts:
            - {name: runtime, mountPath: /app/proxy_gateway/_runtime}
            - {name: database, mountPath: /run/secrets/proxy_db_password, subPath: app-password, readOnly: true}
            - {name: database, mountPath: /run/secrets/postgres_ca, subPath: ca.crt, readOnly: true}
            - {name: mqtt, mountPath: /run/secrets/mqtt_ca, subPath: ca.crt, readOnly: true}
            - {name: mqtt, mountPath: /run/secrets/proxy_mqtt_cert, subPath: tls.crt, readOnly: true}
            - {name: mqtt, mountPath: /run/secrets/proxy_mqtt_key, subPath: tls.key, readOnly: true}
            - {name: https, mountPath: /run/secrets/proxy_https_cert, subPath: tls.crt, readOnly: true}
            - {name: https, mountPath: /run/secrets/proxy_https_key, subPath: tls.key, readOnly: true}
            - {name: wss, mountPath: /run/secrets/proxy_wss_cert, subPath: tls.crt, readOnly: true}
            - {name: wss, mountPath: /run/secrets/proxy_wss_key, subPath: tls.key, readOnly: true}
            - {name: security, mountPath: /run/secrets/password_pepper, subPath: password-pepper, readOnly: true}
            - {name: security, mountPath: /run/secrets/token_pepper, subPath: token-pepper, readOnly: true}
            - {name: security, mountPath: /run/secrets/binding_pepper, subPath: binding-pepper, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: runtime
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-runtime}
        - name: database
          secret:
            secretName: {{ .Values.secretRefs.database }}
            defaultMode: 0440
        - name: mqtt
          secret:
            secretName: {{ .Values.secretRefs.mqtt }}
            defaultMode: 0440
        - name: https
          secret:
            secretName: {{ .Values.secretRefs.https }}
            defaultMode: 0440
        - name: wss
          secret:
            secretName: {{ .Values.secretRefs.wss }}
            defaultMode: 0440
        - name: security
          secret:
            secretName: {{ .Values.secretRefs.security }}
            defaultMode: 0440
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 256Mi}

{{- end }}
