{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: automation-proxy
  labels:
    app.kubernetes.io/name: automation-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: automation-platform
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: automation-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: wss, port: 8443, targetPort: wss, protocol: TCP}
    - {name: https, port: 8444, targetPort: https, protocol: TCP}

{{- end }}
