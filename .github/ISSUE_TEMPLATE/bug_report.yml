name: Bug report
description: Report reproducible Control Plane behavior in an authorized lab.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, keys, kubeconfigs, plant data or vulnerability details.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.27.3 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Linux, Python, Docker/Helm/Kubernetes versions and provider mode
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction and sanitized evidence
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: The reproduction uses an authorized non-production environment.
          required: true
        - label: I removed credentials, target secrets and confidential plant information.
          required: true
