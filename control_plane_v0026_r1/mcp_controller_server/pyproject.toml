[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-mcp-controller-server"
version = "0.1.0"
description = "MCP-to-MQTT control, monitoring and orchestration boundary"
requires-python = ">=3.12"
dependencies = [
  "click==8.5.0",
  "h11==0.16.0",
  "uvicorn==0.51.0",
]

[project.scripts]
automation-mcp-controller = "mcp_controller_server.main:main"
automation-mcp-approval = "mcp_controller_server.approval_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
