name: automation-mqtt

x-mosquitto-image: &mosquitto-image
  image: ${MOSQUITTO_IMAGE:-eclipse-mosquitto:2.1.2-alpine}

services:
  mqtt-broker:
    <<: *mosquitto-image
    hostname: mqtt-broker
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PUID: "1883"
      PGID: "1883"
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_PORT:-8883}:8883"
    secrets:
      - mqtt_ca
      - mqtt_broker_cert
      - mqtt_broker_key
      - mqtt_health_cert
      - mqtt_health_key
    volumes:
      - ./runtime-config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
    networks:
      control_egress:
        aliases:
          - mqtt-broker
          - automation-mqtt
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /mosquitto/log:rw,noexec,nosuid,size=16m,uid=1883,gid=1883
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h localhost -p 8883 -V 5 -q 0
          -i automation-mqtt-health
          --cafile /run/secrets/mqtt_ca
          --cert /run/secrets/mqtt_health_cert
          --key /run/secrets/mqtt_health_key
          -t '$$SYS/broker/uptime' -C 1 -W 5 >/dev/null
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 10s

  mqtt-tools:
    <<: *mosquitto-image
    profiles: [tools]
    entrypoint: ["/bin/true"]
    networks:
      - control_egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mosquitto_data:

networks:
  control_egress:
    external: true
    name: automation_control

secrets:
  mqtt_ca:
    file: ./secrets/mqtt_ca.crt
  mqtt_broker_cert:
    file: ./secrets/mqtt_broker.crt
  mqtt_broker_key:
    file: ./secrets/mqtt_broker.key
  mqtt_health_cert:
    file: ./secrets/mqtt_health.crt
  mqtt_health_key:
    file: ./secrets/mqtt_health.key
