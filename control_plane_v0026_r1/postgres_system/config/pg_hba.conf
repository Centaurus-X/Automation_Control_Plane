# Local administration uses the container operating-system postgres account.
local   all             postgres                                peer
local   all             all                                     scram-sha-256
local   replication     postgres                                peer

# TLS-only application and migration access on the fixed internal network.
hostssl automation_platform master_app       172.30.0.0/24       scram-sha-256
hostssl automation_platform proxy_app        172.30.0.0/24       scram-sha-256
hostssl automation_platform master_migrator  172.30.0.0/24       scram-sha-256
hostssl automation_platform proxy_migrator   172.30.0.0/24       scram-sha-256
hostssl replication        replicator        172.30.0.0/24       scram-sha-256

# Local TLS diagnostics.
hostssl all             all             127.0.0.1/32            scram-sha-256
hostssl all             all             ::1/128                 scram-sha-256

# Explicitly reject cleartext TCP and every network outside the DB plane.
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::0/0                    reject
hostssl   all           all             0.0.0.0/0               reject
hostssl   all           all             ::0/0                    reject
